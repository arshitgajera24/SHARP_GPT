name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Fix 1: Git safe directory
            git config --global --add safe.directory /home/ubuntu/SHARP_GPT

            # Fix 2: Pull latest code
            cd /home/ubuntu/SHARP_GPT
            git pull origin main

            # Fix 3: Go to server folder where docker-compose.yml is
            cd /home/ubuntu/SHARP_GPT/server

            # Fix 4: Run docker with sudo
            sudo docker compose down
            sudo docker compose up --build -d
            sudo docker image prune -f